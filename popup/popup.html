<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="popup.css" />
  <title>Media Downloader</title>
</head>
<body>
  <header>
    <span class="logo">MD</span>
    <h1>Media Downloader</h1>
    <button id="btn-ajustes" title="Ajustes" aria-label="Ajustes">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.01a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </header>

  <section id="panel-ajustes" hidden>
    <label>
      Repositorio GitHub
      <input id="in-repo" type="text" placeholder="usuario/repositorio" spellcheck="false" />
    </label>
    <label>
      Rama
      <input id="in-rama" type="text" placeholder="main" spellcheck="false" />
    </label>
    <p class="pista">
      Cada sitio se descarga de
      <code>raw.githubusercontent.com/&lt;repo&gt;/&lt;rama&gt;/scripts/&lt;sitio&gt;.js</code>
    </p>
  </section>

  <div id="aviso-permiso" hidden>
    <strong>Falta un permiso:</strong> abre <code>brave://extensions</code>, entra en
    Media Downloader y activa <strong>«Permitir scripts de usuario»</strong>. Después
    recarga las páginas.
    <div id="detalle-permiso" class="pista"></div>
  </div>

  <main id="lista-sitios"></main>

  <div id="estado-tab" class="pista" hidden></div>

  <footer>
    <button id="btn-actualizar">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
           stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/>
      </svg>
      <span id="btn-actualizar-texto">Actualizar desde GitHub</span>
    </button>
    <div id="estado-sync" class="pista"></div>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
